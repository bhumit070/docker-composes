user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Only send "Connection: upgrade" for websocket requests
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Wildcard cert for *.bhumit070.bid, issued by the certbot service
    ssl_certificate     /etc/letsencrypt/live/bhumit070.bid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bhumit070.bid/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Docker's embedded DNS. Sites put their upstream in a variable (set $upstream ...)
    # so nginx re-resolves container names instead of caching the IP from startup,
    # which goes stale (502) whenever a container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/conf.d/*.conf;
}