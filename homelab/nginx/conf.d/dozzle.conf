# Dozzle (streams logs, so no buffering)
server {
    listen 443 ssl;
    http2 on;
    server_name dozzle.bhumit070.bid;

    location / {
        set $upstream http://dozzle:8080; # variable => re-resolved via resolver in nginx.conf
        proxy_pass $upstream;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
