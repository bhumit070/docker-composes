# Dozzle (streams logs, so no buffering)
server {
    listen 80;
    server_name dozzle.bhumit070.bid;

    location / {
        proxy_pass http://dozzle:8080;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
