# Send Any Webhook to Discord
server {
    listen 443 ssl;
    http2 on;
    server_name webhooks.bhumit070.bid;

    client_max_body_size 2M; # matches the app's backend bodyLimit

    location / {
        set $upstream http://webhooks-frontend:80; # variable => re-resolved via resolver in nginx.conf
        proxy_pass $upstream;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
}
