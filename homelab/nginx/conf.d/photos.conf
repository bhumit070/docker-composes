# Immich
server {
    listen 80;
    server_name photos.bhumit070.bid;

    client_max_body_size 50000M; # large video uploads

    location / {
        proxy_pass http://immich_server:2283;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_redirect off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        send_timeout 600s;
    }
}
