# Portainer (serves HTTPS with a self-signed cert internally)
server {
    listen 443 ssl;
    http2 on;
    server_name portainer.bhumit070.bid;

    location / {
        set $upstream https://portainer:9443; # variable => re-resolved via resolver in nginx.conf
        proxy_pass $upstream;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_read_timeout 1h; # container console
    }
}
