# Jellyfin
server {
    listen 443 ssl;
    http2 on;
    server_name media.bhumit070.bid;

    location / {
        set $upstream http://jellyfin:8096; # variable => re-resolved via resolver in nginx.conf
        proxy_pass $upstream;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_buffering off;
    }
}
