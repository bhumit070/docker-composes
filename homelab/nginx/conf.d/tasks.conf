# Vikunja
server {
    listen 443 ssl;
    http2 on;
    server_name tasks.bhumit070.bid;

    client_max_body_size 20M; # attachments

    location / {
        set $upstream http://vikunja:3456; # variable => re-resolved via resolver in nginx.conf
        proxy_pass $upstream;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
}
