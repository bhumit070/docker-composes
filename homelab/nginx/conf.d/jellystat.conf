# Jellystat
server {
    listen 443 ssl;
    http2 on;
    server_name jellystat.bhumit070.bid;

    location / {
        set $upstream http://jellystat:3000; # variable => re-resolved via resolver in nginx.conf
        proxy_pass $upstream;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
}
