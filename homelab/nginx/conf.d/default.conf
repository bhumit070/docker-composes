# Tailscale machine name, and the fallback for any unknown host
server {
    listen 80 default_server;
    server_name codingmachine;

    location / {
        set $upstream http://glance:8080; # variable => re-resolved via resolver in nginx.conf
        proxy_pass $upstream;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
}

# Unknown hosts on HTTPS: refuse instead of serving another site's content
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}
