# Stirling PDF
server {
    listen 443 ssl;
    http2 on;
    server_name pdf.bhumit070.bid;

    client_max_body_size 500M; # large PDF uploads

    location / {
        set $upstream http://stirling-pdf:8080; # variable => re-resolved via resolver in nginx.conf
        proxy_pass $upstream;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_read_timeout 600s; # OCR / conversions can take a while
    }
}
