# Filebrowser
server {
    listen 443 ssl;
    http2 on;
    server_name files.bhumit070.bid;

    client_max_body_size 0; # no upload limit

    location / {
        set $upstream http://filebrowser:80; # variable => re-resolved via resolver in nginx.conf
        proxy_pass $upstream;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
