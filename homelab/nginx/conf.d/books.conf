# Kavita
server {
    listen 443 ssl;
    http2 on;
    server_name books.bhumit070.bid;

    client_max_body_size 100M;

    location / {
        set $upstream http://kavita:5000; # variable => re-resolved via resolver in nginx.conf
        proxy_pass $upstream;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
}
