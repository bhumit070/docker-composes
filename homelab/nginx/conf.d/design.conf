# Penpot
server {
    listen 443 ssl;
    http2 on;
    server_name design.bhumit070.bid;

    client_max_body_size 350M; # matches PENPOT_HTTP_SERVER_MAX_BODY_SIZE

    location / {
        set $upstream http://penpot-frontend:8080; # variable => re-resolved via resolver in nginx.conf
        proxy_pass $upstream;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_read_timeout 600s; # long-lived websocket for collaboration
    }
}
