name: homelab

services:
  immich-server: # Self hosted photos
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ${IMMICH_UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - DB_HOSTNAME=immich_postgres
    ports:
      - "2283:2283"
    depends_on:
      - redis
      - immich_postgres
    restart: always
    healthcheck:
      disable: false
    networks:
      - default

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false
    networks:
      - default

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:546304417feac0874c3dd576e0952c6bb8f06bb4093ea0c9ca303c73cf458f63
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always
    networks:
      - default

  immich_postgres:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: ${IMMICH_DB_USERNAME}
      POSTGRES_DB: ${IMMICH_DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      DB_STORAGE_TYPE: "HDD"
    volumes:
      - ${IMMICH_DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER"]
      interval: 2s
      start_period: 30s
    networks:
      - default

  jellyfin: # Self hosted media server
    image: jellyfin/jellyfin:10.11.6
    container_name: jellyfin
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    volumes:
      - ./jellyfin-config:/config
      - ./jellyfin-cache:/cache
      - type: bind
        source: ${JELLYFIN_MEDIA_LOCATION}
        target: /media
    restart: always
    networks:
      - default

  dozzle: # Docker container logs viewer
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: always
    ports:
      - "5050:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default

  glance: # Dashboard for homelab
    container_name: glance
    image: glanceapp/glance
    restart: unless-stopped
    volumes:
      - ./glance/config/:/app/config
      - ./glance/assets/:/app/assets
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    #ports:
    #  - 80:8080
    #  - 443:8080
    env_file: .env
    networks:
      - default

  filebrowser: # File browser for homelab
    image: filebrowser/filebrowser
    container_name: filebrowser
    ports:
      - "8080:80"
    volumes:
      - /:/srv
      - filebrowser_database:/database
      - filebrowser_config:/config
    restart: always
    networks:
      - default

  vikunja:
    image: vikunja/vikunja:2.1.0
    container_name: vikunja
    environment:
      VIKUNJA_SERVICE_PUBLICURL: http://codingmachine:3456/
      VIKUNJA_SERVICE_JWTSECRET: 8e3f85dc9c917207cab5ff09c65852de6514f33580d2412d8cf3c20b5760de3b
      VIKUNJA_DATABASE_HOST: vikunja_db
      VIKUNJA_DATABASE_PASSWORD: ${VIKUNJA_DB_PASSWORD}
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_USER: vikunja
      VIKUNJA_DATABASE_DATABASE: vikunja
    ports:
      - 3456:3456
    volumes:
      - ./docker-data/vikunja_files:/app/vikunja/files
    depends_on:
      vikunja_db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

  vikunja_db:
    image: postgres:18
    container_name: vikunja_db
    environment:
      POSTGRES_PASSWORD: ${VIKUNJA_DB_PASSWORD}
      POSTGRES_USER: vikunja
    volumes:
      - ~/docker/vikunja_db:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER"]
      interval: 2s
      start_period: 30s
    networks:
      - default

  portainer:
    container_name: portainer
    image: portainer/portainer-ce:sts
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-data/portainer_data:/data
    ports:
      - 9443:9443
    networks:
      - default

  nginx:
    image: nginx:1.29.6
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    restart: always
    networks:
      - default

  navidrome: # Music Player
    container_name: navidrome
    image: deluan/navidrome:pr-5218
    ports:
      - "4533:4533"
    restart: always
    volumes:
      - "./docker-data/navidrome:/data"
      - "${NAVIDROME_MUSIC_PATH}:/music:ro"

volumes:
  model-cache:
  filebrowser_data:
  filebrowser_database:
  filebrowser_config:

networks:
  default:
    name: homelab_network
