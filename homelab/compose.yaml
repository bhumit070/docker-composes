name: homelab

services:
  immich_server: # Self hosted photos
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ${IMMICH_UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - DB_HOSTNAME=immich_postgres
      - REDIS_HOSTNAME=immich_redis
      - IMMICH_MACHINE_LEARNING_URL=http://immich_machine_learning:3003
    ports:
      - "2283:2283"
    depends_on:
      - immich_redis
      - immich_postgres
    restart: always
    healthcheck:
      disable: false
    networks:
      - default

  immich_machine_learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false
    networks:
      - default

  immich_redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:546304417feac0874c3dd576e0952c6bb8f06bb4093ea0c9ca303c73cf458f63
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always
    networks:
      - default

  immich_postgres:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: ${IMMICH_DB_USERNAME}
      POSTGRES_DB: ${IMMICH_DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      DB_STORAGE_TYPE: "HDD"
    volumes:
      - ${IMMICH_DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER"]
      interval: 2s
      start_period: 30s
    networks:
      - default

  jellyfin: # Self hosted media server
    image: jellyfin/jellyfin@sha256:baba630419915985442f315f08b0cf46d9f4c8a0cc4bd38e94a6d35751dd5ef5
    container_name: jellyfin
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    volumes:
      - ./jellyfin-config:/config
      - ./jellyfin-cache:/cache
      - type: bind
        source: ${JELLYFIN_MEDIA_LOCATION}
        target: /media
    restart: always
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dozzle: # Docker container logs viewer
    image: amir20/dozzle@sha256:223175f09a979f9eb007d46c8314304f4510832cc0a0c85ae42be63b41cb2636
    container_name: dozzle
    restart: always
    ports:
      - "5050:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 3s
      timeout: 30s
      retries: 5
      start_period: 30s

  glance: # Dashboard for homelab
    container_name: glance
    image: glanceapp/glance@sha256:6df86a7e8868d1eda21f35205134b1962c422957e42a0c44d4717c8e8f741b1a
    restart: unless-stopped
    volumes:
      - ./glance/config/:/app/config
      - ./glance/assets/:/app/assets
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file: .env
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  filebrowser: # File browser for homelab
    image: filebrowser/filebrowser@sha256:a1d6addab1b8335d807088f869e5cd17773b99d922c8d63de45ef0fa23a9c35a
    container_name: filebrowser
    ports:
      - "8080:80"
    volumes:
      - /:/srv
      - ./docker_data/filebrowser_database:/database
      - ./docker_data/filebrowser_config:/config
    restart: always
    networks:
      - default
    environment:
      FB_TOKEN_EXPIRATION_TIME: 24h

  vikunja:
    image: vikunja/vikunja@sha256:f13103b0287aef74a69241fa46e6cac76e14caf643602144ccaca57fc76e587f
    container_name: vikunja
    environment:
      VIKUNJA_SERVICE_PUBLICURL: https://tasks.bhumit070.bid/
      VIKUNJA_SERVICE_JWTSECRET: 8e3f85dc9c917207cab5ff09c65852de6514f33580d2412d8cf3c20b5760de3b
      VIKUNJA_DATABASE_HOST: vikunja_db
      VIKUNJA_DATABASE_PASSWORD: ${VIKUNJA_DB_PASSWORD}
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_USER: vikunja
      VIKUNJA_DATABASE_DATABASE: vikunja
    ports:
      - 3456:3456
    volumes:
      - ./docker_data/vikunja_files:/app/vikunja/files
    depends_on:
      vikunja_db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD", "/app/vikunja/vikunja", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  vikunja_db:
    image: postgres@sha256:a9abf4275f9e99bff8e6aed712b3b7dfec9cac1341bba01c1ffdfce9ff9fc34a
    container_name: vikunja_db
    environment:
      POSTGRES_PASSWORD: ${VIKUNJA_DB_PASSWORD}
      POSTGRES_USER: vikunja
    volumes:
      - ~/docker/vikunja_db:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER"]
      interval: 2s
      start_period: 30s
    networks:
      - default

  portainer:
    container_name: portainer
    image: portainer/portainer-ce@sha256:1ae8e65d50ca5498cb2c33e617495a1e3ef245b0d2392b4a44c70ae09b822891
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker_data/portainer_data:/data
    ports:
      - 9443:9443
    networks:
      - default
    healthcheck:
      test: ["CMD", "/portainer", "--help"]
      interval: 2s
      timeout: 10s
      retries: 3
      start_period: 30s

  certbot: # Let's Encrypt wildcard cert for *.bhumit070.bid via Cloudflare DNS
    image: certbot/dns-cloudflare@sha256:c45edb002b883da1a1235abb205dff474a7a1a459d878e8d5fdc7f9d83073aea
    container_name: certbot
    volumes:
      - ./docker_data/letsencrypt:/etc/letsencrypt
      - ./docker_data/certbot/cloudflare.ini:/cloudflare.ini:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM
        if [ ! -f /etc/letsencrypt/live/bhumit070.bid/fullchain.pem ]; then
          certbot certonly --non-interactive --agree-tos --register-unsafely-without-email \
            --dns-cloudflare --dns-cloudflare-credentials /cloudflare.ini \
            --dns-cloudflare-propagation-seconds 30 \
            --cert-name bhumit070.bid -d bhumit070.bid -d '*.bhumit070.bid' || exit 1
        fi
        while :; do
          certbot renew --quiet
          sleep 12h & wait $$!
        done
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-f", "/etc/letsencrypt/live/bhumit070.bid/fullchain.pem"]
      interval: 10s
      start_period: 180s
    networks:
      - default

  nginx:
    image: nginx@sha256:dead9cf6bae3a0447c3148dd1afb374a3c8339b8875298bd3130387f64abf879
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker_data/letsencrypt:/etc/letsencrypt:ro
    # Reload every 6h so renewed certificates are picked up
    command: ["/bin/sh", "-c", "while :; do sleep 6h & wait $$!; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    depends_on:
      certbot:
        condition: service_healthy
    restart: always
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  kavita: # Book reader
    image: jvmilazz0/kavita@sha256:2c134b9d9a0db27f68282d3cd55dc2733331020e9df9f3baabddad74e6cbab2c
    container_name: kavita
    volumes:
      - ${KAVITA_BOOKS_COLLECTION_LOCATION}:/books
      - ./docker_data/kavita_config:/kavita/config
    environment:
      - TZ=${TZ}
    ports:
      - "5000:5000"
    restart: always

  jellystat:
    image: cyfershepard/jellystat@sha256:f7f56aabad139faa996b8bb21a36dd3e65f7c87e10408921815b95a28a4efbaf
    container_name: jellystat
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_IP: jellystat-db
      POSTGRES_PORT: 5432
      JWT_SECRET: "my-secret-jwt-key"
      TZ: Asia/Kolkata # timezone (ex: Europe/Paris)
    volumes:
      - ./docker_data/jellystat_backup_data:/app/backend/backup-data
    ports:
      - "3000:3000"
    depends_on:
      jellystat-db:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/auth/isConfigured || exit 1
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s

  jellystat-db:
    image: postgres@sha256:1090bc3a8ccfb0b55f78a494d76f8d603434f7e4553543d6e807bc7bd6bbd17f
    shm_size: "1gb"
    container_name: jellystat-db
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --dbname=postgres --username=postgres
      interval: 10s
      timeout: 5s
      retries: 5

  penpot-frontend: # Design & prototyping (v2.18.5)
    image: penpotapp/frontend@sha256:9bc0c288985d2d18a2c3e7b849d8edda317e1bfd99ec6dd494e5bfdcfe411f06
    container_name: penpot-frontend
    restart: unless-stopped
    ports:
      - "9001:8080"
    volumes:
      - ./docker_data/penpot_assets:/opt/data/assets
    depends_on:
      - penpot-backend
      - penpot-exporter
    environment:
      PENPOT_FLAGS: ${PENPOT_FLAGS:-disable-email-verification}
      PENPOT_PUBLIC_URI: https://design.bhumit070.bid
      PENPOT_HTTP_SERVER_MAX_BODY_SIZE: 367001600
      PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE: 367001600
    networks:
      - default

  penpot-backend:
    image: penpotapp/backend@sha256:20d2325ec8e00f4be5f65e543d5618b585598facff404cf06446e91b5ead9036
    container_name: penpot-backend
    restart: unless-stopped
    volumes:
      - ./docker_data/penpot_assets:/opt/data/assets
    depends_on:
      penpot-postgres:
        condition: service_healthy
      penpot-valkey:
        condition: service_healthy
    environment:
      PENPOT_FLAGS: ${PENPOT_FLAGS:-disable-email-verification}
      PENPOT_PUBLIC_URI: https://design.bhumit070.bid
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY}
      PENPOT_HTTP_SERVER_MAX_BODY_SIZE: 367001600
      PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE: 367001600
      PENPOT_DATABASE_URI: postgresql://penpot-postgres/penpot
      PENPOT_DATABASE_USERNAME: penpot
      PENPOT_DATABASE_PASSWORD: ${PENPOT_DB_PASSWORD}
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
      PENPOT_TELEMETRY_ENABLED: "false"
    networks:
      - default

  penpot-exporter:
    image: penpotapp/exporter@sha256:8c341d6d40f234d33e4272f87c6f53fdde839546e4c758872cebf175bddb8c71
    container_name: penpot-exporter
    restart: unless-stopped
    depends_on:
      penpot-valkey:
        condition: service_healthy
    environment:
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY}
      PENPOT_PUBLIC_URI: https://design.bhumit070.bid
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0
    networks:
      - default

  penpot-postgres:
    image: postgres@sha256:baa22e6286bf832cb147b8bb5aa9d8bc999846d69c21d11bf63f58fbeed1fa48 # postgres:15
    container_name: penpot-postgres
    restart: unless-stopped
    stop_signal: SIGINT
    environment:
      POSTGRES_INITDB_ARGS: "--data-checksums"
      POSTGRES_DB: penpot
      POSTGRES_USER: penpot
      POSTGRES_PASSWORD: ${PENPOT_DB_PASSWORD}
    volumes:
      - ./docker_data/penpot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penpot"]
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 2s
    networks:
      - default

  penpot-valkey:
    image: valkey/valkey@sha256:8f836008e0986c36adf50da714c7060cf689dbb335f61fe077939d90fa650809 # valkey:8.1
    container_name: penpot-valkey
    restart: unless-stopped
    environment:
      VALKEY_EXTRA_FLAGS: "--maxmemory 128mb --maxmemory-policy volatile-lfu"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - default

  stirling-pdf:
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf@sha256:aa91c68b85992986302fbdb6735f2c0824e329304e43c814a9b77c9dd0dbe410
    container_name: stirling-pdf
    restart: unless-stopped
    ports:
      - "3030:8080"
    volumes:
      - ./docker_data/stirling-pdf/trainingData:/usr/share/tessdata
      - ./docker_data/stirling-pdf/extraConfigs:/configs
      - ./docker_data/stirling-pdf/customFiles:/customFiles
      - ./docker_data/stirling-pdf/logs:/logs
    environment:
      - DOCKER_ENABLE_SECURITY=false
volumes:
  model-cache:
  filebrowser_data:
  filebrowser_database:
  filebrowser_config:
  postgres-data:

networks:
  default:
    name: homelab_network
