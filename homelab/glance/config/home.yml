- name: Home
  columns:
    - size: small
      widgets:
        - type: calendar
          first-day-of-week: sunday

        - type: clock
          hour-format: 24h
          timezones:
            - timezone: Asia/Kolkata
              label: India
            - timezone: Asia/Tokyo
              label: Japan

    - size: full
      widgets:
        - type: iframe
          source: https://dozzle.bhumit070.bid/
          height: 300

        - type: bookmarks
          groups:
            - title: Media
              links:
                - title: Jellyfin
                  url: https://media.bhumit070.bid
                  icon: si:jellyfin

                - title: Jellystat
                  url: https://jellystat.bhumit070.bid
                  icon: si:jellyfin

                - title: Photos
                  url: https://photos.bhumit070.bid
                  icon: si:immich

                - title: qBittorrent
                  url: http://codingmachine:5678
                  icon: si:qbittorrent

                - title: Books
                  url: https://books.bhumit070.bid
                  icon: si:bookstack

                - title: Youtube to RSS
                  url: https://vimrss.com/tool/youtube-to-rss
                  icon: si:youtube

            - title: Productivity
              links:
                - title: FileBrowser
                  url: https://files.bhumit070.bid
                  icon: si:files

                - title: Linkedin Post Generator
                  url: http://codingmachine:5701
                  icon: si:postiz

                - title: Task management
                  url: https://tasks.bhumit070.bid
                  icon: si:todoist

                - title: Penpot
                  url: https://design.bhumit070.bid
                  icon: si:penpot

                - title: Stirling PDF
                  url: http://codingmachine:3030
                  icon: si:ilovepdf

            - title: Docker
              links:
