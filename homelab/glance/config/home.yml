- name: Home
  columns:
    - size: small
      widgets:
        - type: calendar
          first-day-of-week: sunday

        - type: clock
          hour-format: 24h
          timezones:
            - timezone: Asia/Kolkata
              label: India
            - timezone: Asia/Tokyo
              label: Japan

        - type: bookmarks
          groups:
            - title: Homelab
              links:
              - title: Jellyfin
                url: http://codingmachine:8096
                icon: si:jellyfin

              - title: Photos
                url: http://codingmachine:8096
                icon: si:immich

              - title: qBittorrent
                url: http://codingmachine:8080
                icon: si:qbittorrent

              - title: Dozzle
                url: http://codingmachine:5050
                icon: si:docker

    - size: full
      widgets:
        - type: iframe
          source: http://codingmachine:5050/
          height: 400

        - type: docker-containers
          hide-by-default: false

