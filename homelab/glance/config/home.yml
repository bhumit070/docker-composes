- name: Home
  columns:
    - size: small
      widgets:
        - type: calendar
          first-day-of-week: sunday

        - type: clock
          hour-format: 24h
          timezones:
            - timezone: Asia/Kolkata
              label: India
            - timezone: Asia/Tokyo
              label: Japan

    - size: full
      widgets:
        - type: iframe
          source: http://codingmachine:5050/
          height: 300

        - type: bookmarks
          groups:
            - title: Media
              links:
                - title: Jellyfin
                  url: http://codingmachine:8096
                  icon: si:jellyfin

                - title: Photos
                  url: http://codingmachine:2283
                  icon: si:immich

                - title: qBittorrent
                  url: http://codingmachine:5678
                  icon: si:qbittorrent

                - title: Books
                  url: http://codingmachine:5000
                  icon: si:bookstack

                - title: Youtube to RSS
                  url: https://vimrss.com/tool/youtube-to-rss
                  icon: si:youtube

            - title: Productivity
              links:
                - title: FileBrowser
                  url: http://codingmachine:8080
                  icon: si:files

                - title: Linkedin Post Generator
                  url: http://codingmachine:5701
                  icon: si:postiz

                - title: Task management
                  url: http://codingmachine:3456
                  icon: si:todoist

            - title: Docker
              links:
                - title: Dozzle
                  url: http://codingmachine:5050
                  icon: si:docker

                - title: Portainer
                  url: https://codingmachine:9443
                  icon: si:docker

        - type: docker-containers
          hide-by-default: false

