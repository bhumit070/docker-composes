version: "2.1"
services:
  jellyfin:
    image: jellyfin/jellyfin:10.9.3
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Warsaw
      - JELLYFIN_PublishedServerUrl=192.168.0.5 #optional
    volumes:
      - /srv/dev-disk-by-label-NAS/Config/Jellyfin:/config
      - /Users/bhumit070/Downloads/Travelers (2016) Season 1-3 S01-S03 (1080p DS4K NF WEB-DL x265 HEVC 10bit DD 5.1 Vyndros)/travelers
      - /opt/vc/lib:/opt/vc/lib #optional
    ports:
      - 8096:8096
      - 8920:8920
      - 7359:7359/udp
      - 1900:1900/udp
    restart: always
